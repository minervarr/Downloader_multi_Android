plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'io.nava.downloader_multi'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "io.nava.downloader_multi"
        minSdk 24  // SDL3 requires API 24+
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // NDK configuration - all ABIs
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -frtti -fexceptions'
                arguments '-DANDROID_STL=c++_shared',
                          '-DDOWNLOADER_USE_VULKAN=ON',
                          '-DDOWNLOADER_USE_SDL3=ON',
                          '-DSDL_SHARED=OFF',
                          '-DSDL_STATIC=ON'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Debug'
                }
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        viewBinding false  // Not needed for SDL3
    }

    // SDL3 specific: include SDL Java sources
    sourceSets {
        main {
            java.srcDirs += ['src/main/cpp/extern/SDL3/android-project/app/src/main/java']
        }
    }

    // Packaging options for native libraries
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Minimal dependencies for SDL3
    implementation libs.appcompat
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
